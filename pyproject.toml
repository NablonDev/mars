[project]
name = "mars"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Kaustubh Trivedi", email = "kaustubh.trivedi@nablon.ai" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.13.0",
    "fastapi>=0.115.0",
    "httpx>=0.27.0",
    "langchain-core>=0.3.0",
    "langchain-openai>=0.2.0",
    "psycopg[binary]>=3.1.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.4.0",
    "pytest>=8.0.0",
    "python-dotenv>=1.0.0",
    "sqlalchemy>=2.0.0",
    "uvicorn[standard]>=0.30.0",
]

[tool.uv]
# Not a distributable package: the importable code lives in `app/` at the
# repo root and is run in place (`uvicorn app.main:app`, `pytest` from the
# repo root), so there is nothing to build or install. Declared explicitly
# so `uv run` does not try to build a `src/` layout that does not exist.
package = false

[tool.ruff]
# No ruff config existed before this change; 110 matches the line length
# already in de facto use across app/ (many pre-existing lines land
# exactly at 110 chars) -- formalized here so `ruff format` doesn't
# rewrap the entire pre-existing codebase to the 88-char default.
line-length = 110

[tool.ruff.lint.flake8-bugbear]
# FastAPI's `Depends(...)`/`Query(...)`/`Path(...)` as argument defaults
# is the framework's documented, intentional pattern (used throughout
# app/api/dependencies.py and every router) -- not the mutable-default-argument
# bug B008 exists to catch. Silences that repo-wide false positive
# without touching any other bugbear rule.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path"]

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "ruff>=0.16.2",
]

[tool.mypy]
# Minimal, permissive baseline so the tool is runnable at all -- there is
# no existing green baseline to hold this to yet (261 pre-existing errors
# across 7 files as of the last check; see
# .claude/agent-memory/coder/feedback_lint_tooling_gap.md). Deliberately
# not `strict = true` and no per-module overrides: tightening this is a
# separate, later decision, not part of this tooling-gate phase.
python_version = "3.12"
ignore_missing_imports = true
