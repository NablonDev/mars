# Manual promotion: point the already-provisioned Container Apps at an image
# already sitting in ACR (pushed by ci-build.yml). Deliberately decoupled
# from every merge -- a human decides when production actually moves. Never
# creates resources and never touches the migration job; a schema change
# still needs a deliberate
# `az containerapp job start -g $RG -n mars-fines-migrate` run first -- see
# docs/DEPLOYMENT.md §6.5/§6.8.

name: CD - Deploy Development

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag already pushed to ACR (e.g. a commit SHA, or 'latest')"
        required: true
        type: string
        default: "latest"

permissions:
  id-token: write
  contents: read

env:
  RESOURCE_GROUP: rg-mars-platform
  ACR_NAME: marsplatformacr
  IMAGE_NAME: mars-platform
  API_APP_NAME: mars-backend-api
  NIGHTLY_JOB_NAME: mars-fines-nightly-batch

jobs:
  deploy:
    name: Deploy to Development
    runs-on: ubuntu-latest
    environment:
      name: development
    steps:
      - name: Azure login (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Point API Container App at image
        run: |
          az containerapp update \
            --resource-group "${{ env.RESOURCE_GROUP }}" \
            --name "${{ env.API_APP_NAME }}" \
            --image "${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:${{ inputs.image_tag }}"

      - name: Point nightly batch Job at image
        run: |
          az containerapp job update \
            --resource-group "${{ env.RESOURCE_GROUP }}" \
            --name "${{ env.NIGHTLY_JOB_NAME }}" \
            --image "${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:${{ inputs.image_tag }}"
